<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word Counter</title>
<link rel="stylesheet" href="WordCounter.css">
</head>
<body>

<main class="container" data-i18n-aria="aria_main" aria-label="Word counter">
  <h1 class="sr-only" data-i18n="title">Word Counter</h1>

  <dl class="stats">
    <div class="stat">
      <dt class="stat-label" data-i18n="label_words">Words</dt>
      <dd class="stat-value" id="wordCount">0</dd>
    </div>
    <div class="stat">
      <dt class="stat-label" data-i18n="label_chars">Characters</dt>
      <dd class="stat-value" id="charCount">0</dd>
      <dd class="stat-sub"><span data-i18n="label_chars_no_spaces">Excl. spaces</span> <span class="stat-sub-value" id="charNoSpaceCount">0</span></dd>
    </div>
    <div class="stat">
      <dt class="stat-label" data-i18n="label_bytes">Bytes (UTF-8)</dt>
      <dd class="stat-value" id="byteCount">0</dd>
    </div>
  </dl>

  <div class="input-area">
    <div class="input-header">
      <label for="textInput" data-i18n="text_label">TEXT</label>
      <button type="button" class="clear-btn" id="clearBtn" data-i18n="clear_btn" data-i18n-aria="aria_clear_btn" aria-label="Clear text" disabled>Clear</button>
    </div>
    <textarea id="textInput" data-i18n-placeholder="input_placeholder" placeholder="Type or paste text here..." spellcheck="false"></textarea>
  </div>
</main>

<div id="srStatus" class="sr-only" aria-live="polite" aria-atomic="true"></div>

<script src="../i18n.js"></script>
<script src="WordCounter_lang.js"></script>
<script src="../settings.js"></script>
<script src="WordCounter.js"></script>

</body>
</html>
